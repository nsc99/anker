name: Publish container images

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Keep rolling tags ordered while allowing all release builds to finish.
concurrency:
  group: images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build tested image and synthetic sync server
        run: |
          nix build .#packages.${{ matrix.system }}.container --out-link image
          nix build .#demo-server --out-link demo
      - name: Smoke test container
        run: bash scripts/test-container.sh ./image ./demo/bin/anker-demo
      - name: Prepare image archive
        run: cp -L image image-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 3

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish architecture images and manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          image=ghcr.io/nsc99/anker
          revision=$(git rev-parse HEAD)
          for arch in amd64 arm64; do
            docker load --input "image-$arch.tar.gz"
            docker tag anker:local "$image:sha-$revision-$arch"
            docker push "$image:sha-$revision-$arch"
          done
          tags=("sha-$revision")
          if [ "$EVENT_NAME" = push ]; then
            master_revision=$(git ls-remote origin refs/heads/master | cut -f1)
            if [ "$revision" = "$master_revision" ]; then tags+=(latest); fi
          fi
          if [ "$EVENT_NAME" = release ]; then
            # A Git release tag must also be a valid container tag.
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9_.-]+)?$ ]]
            tags+=("$RELEASE_TAG")
          fi
          for tag in "${tags[@]}"; do
            docker manifest create "$image:$tag" \
              "$image:sha-$revision-amd64" "$image:sha-$revision-arm64"
            docker manifest push "$image:$tag"
          done
